name: QuantaFate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: Buffer; telegram-check: права бота; demo: карточки; preview: Gemini; draft: черновики; publish: публикация'
        type: choice
        options: [check, telegram-check, demo, preview, draft, publish, carousel-auto, series-auto, editor-auto]
        default: check
      topic:
        description: 'Тема карусели, например: кармический хвост 15–5–8'
        type: string
        default: 'кармический хвост 15–5–8'
      series_theme:
        description: 'Тематическая серия: профессия, партнёр, знакомство, таланты, центр, факты или случайная тема'
        type: choice
        options: [profession, partner, meeting, talents, centre, facts, random]
        default: profession
      series_part:
        description: 'Номер части; 0 — сразу вся серия'
        type: string
        default: '0'
      targets:
        description: 'Цели через запятую: tiktok,pinterest,telegram. Telegram доступен только при publish.'
        type: string
        default: tiktok
      demo_content:
        description: 'Тестовый текст без обращения к Gemini'
        type: boolean
        default: true
      approve_publication:
        description: 'Разрешаю публичную публикацию этих карточек (только режим publish)'
        type: boolean
        default: false
  schedule:
    - cron: '17 16 * * *'

concurrency:
  group: quantafate-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONIOENCODING: utf-8
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ vars.BUFFER_PINTEREST_CHANNEL_ID }}
      PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      MEDIA_BRANCH: ${{ github.event.repository.default_branch }}
      MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
      TARGETS: ${{ github.event_name == 'schedule' && vars.DAILY_TARGETS || inputs.targets }}
      ALLOW_PUBLISH: ${{ github.event_name == 'schedule' && vars.ENABLE_DAILY == 'true' || inputs.approve_publication }}
      DEMO_CONTENT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo_content }}
      TOPIC: ${{ inputs.topic || 'кармический хвост 15–5–8' }}
      SERIES_THEME: ${{ inputs.series_theme || 'profession' }}
      SERIES_PART: ${{ inputs.series_part || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Подготовка Manrope по контрольной сумме
        run: python -c "from carousel import ensure_font; ensure_font()"
      - name: Проверки без публикации
        run: python -m unittest discover -s tests -v
      - name: Обновить память контента без отправок
        if: github.event_name == 'schedule' || inputs.demo_content != true && (inputs.mode == 'editor-auto' || inputs.mode == 'series-auto' || inputs.mode == 'carousel-auto' || inputs.mode == 'publish' || inputs.mode == 'draft')
        run: python sync_content_memory.py
      - name: Запуск
        shell: bash
        run: |
          if [[ "$MODE" == "check" ]]; then
            python check_buffer.py
          elif [[ "$MODE" == "telegram-check" ]]; then
            python check_telegram.py
          elif [[ "$MODE" == "carousel-auto" ]]; then
            extra=()
            if [[ "$DEMO_CONTENT" == "true" ]]; then extra+=(--demo-content); fi
            python agent.py carousel-auto --topic "$TOPIC" --batch "auto-${GITHUB_RUN_ID}" "${extra[@]}"
          elif [[ "$MODE" == "editor-auto" ]]; then
            extra=()
            if [[ "$DEMO_CONTENT" == "true" ]]; then extra+=(--plan-only); fi
            python agent.py editor-auto --batch "editor-${GITHUB_RUN_ID}" "${extra[@]}"
          elif [[ "$MODE" == "series-auto" ]]; then
            extra=()
            if [[ "$DEMO_CONTENT" == "true" ]]; then extra+=(--demo-content); fi
            python agent.py series-auto --series-theme "$SERIES_THEME" --part "$SERIES_PART" --batch "series-${GITHUB_RUN_ID}" "${extra[@]}"
          else
            extra=()
            if [[ "$DEMO_CONTENT" == "true" ]]; then extra+=(--demo-content); fi
            python agent.py "$MODE" --targets "$TARGETS" "${extra[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.mode == 'demo' || inputs.mode == 'preview' || inputs.mode == 'carousel-auto' || inputs.mode == 'series-auto' || inputs.mode == 'editor-auto')
        with:
          name: quantafate-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            !output/series-*/part-*/slides/**
            !output/series-*/part-*/carousel.zip
            !output/series-*/part-*/pinterest/slides/**
            !output/series-*/part-*/pinterest/carousel.zip
            !output/editor-*/part-*/slides/**
            !output/editor-*/part-*/carousel.zip
            !output/editor-*/part-*/pinterest/slides/**
            !output/editor-*/part-*/pinterest/carousel.zip
          retention-days: 3
          if-no-files-found: ignore

