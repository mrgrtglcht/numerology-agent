name: Check Upload-Post Pinterest
on:
  push:
    paths: ['.github/workflows/upload-post-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_PROFILE: ${{ vars.UPLOAD_POST_PROFILE }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python upload_post.py
