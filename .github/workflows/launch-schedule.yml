name: TikTok launch schedule
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/launch-schedule.yml']
permissions:
  contents: write
concurrency:
  group: quantafate-delivery
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      POSTWIRE_API_KEY: ${{ secrets.POSTWIRE_API_KEY }}
      POSTWIRE_BRAND_ID: ${{ vars.POSTWIRE_BRAND_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python launch_schedule.py
