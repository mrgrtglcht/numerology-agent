name: QuantaFate Pinterest
on:
  push:
    paths: ['.github/workflows/pinterest.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish, status]
        default: preview
  schedule:
    - cron: '30 16,17 * * 2,6'
permissions:
  contents: write
concurrency:
  group: quantafate-delivery
  cancel-in-progress: false
jobs:
  pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ vars.BUFFER_PINTEREST_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONIOENCODING: utf-8
      MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'push' && 'preview' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python pinterest_cloud.py "$MODE"
