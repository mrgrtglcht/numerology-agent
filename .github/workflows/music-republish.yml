name: TikTok music replacement

on:
  push:
    paths: ['.github/workflows/music-republish.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, publish, status]
        default: prepare
      part:
        type: choice
        options: ['1', '2']
        default: '1'
      approve_publication:
        type: boolean
        default: false
      old_posts_removed:
        type: boolean
        default: false

concurrency:
  group: quantafate-delivery
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      POSTWIRE_API_KEY: ${{ secrets.POSTWIRE_API_KEY }}
      POSTWIRE_BRAND_ID: ${{ vars.POSTWIRE_BRAND_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MEDIA_BRANCH: main
      PYTHONIOENCODING: utf-8
      MODE: ${{ github.event_name == 'push' && 'prepare' || inputs.mode }}
      PART: ${{ inputs.part || '1' }}
      ALLOW_MUSIC_REPLACEMENT: ${{ inputs.approve_publication }}
      OLD_POSTS_REMOVED: ${{ inputs.old_posts_removed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python music_republish.py "$MODE" --part "$PART"
