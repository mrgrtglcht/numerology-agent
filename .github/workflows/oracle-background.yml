name: Verify oracle atmosphere
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/oracle-background.yml']
permissions:
  contents: write
concurrency:
  group: quantafate-delivery
  cancel-in-progress: false
jobs:
  background:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      POSTWIRE_API_KEY: ${{ secrets.POSTWIRE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python repair_oracle_background.py

