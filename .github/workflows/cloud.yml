name: QuantaFate cloud publishing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check — подключения; preview — без отправки; publish — отправка'
        type: choice
        options: [check, preview, publish, publish-prepared]
        default: check
      target:
        description: 'Канал'
        type: choice
        options: [tiktok, telegram]
        default: tiktok
      approve_publication:
        description: 'Разрешаю ручную отправку (только publish)'
        type: boolean
        default: false
      source_run:
        description: 'ID успешного preview TikTok (только publish-prepared)'
        type: string
        default: ''
  schedule:
    - cron: '17 5 * * *'
    - cron: '30 16,17 * * 0,3'

concurrency:
  group: quantafate-delivery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  cloud:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_TIKTOK_CLOUD == 'true' || vars.ENABLE_TELEGRAM_CLOUD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ vars.BUFFER_PINTEREST_CHANNEL_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      MEDIA_BRANCH: ${{ github.event.repository.default_branch }}
      ENABLE_TIKTOK_CLOUD: ${{ vars.ENABLE_TIKTOK_CLOUD }}
      ENABLE_TELEGRAM_CLOUD: ${{ vars.ENABLE_TELEGRAM_CLOUD }}
      PUBLICATION_ASSETS: 'true'
      MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      TARGET: ${{ inputs.target || 'tiktok' }}
      ALLOW_PUBLISH: ${{ inputs.approve_publication }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SCHEDULE_TRIGGER: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Проверки без отправок
        run: python -m unittest discover -s tests -v
        env:
          PUBLICATION_ASSETS: 'false'
      - name: Сверить подтверждённые публикации с Buffer
        run: python sync_content_memory.py
      - name: Подготовить и отправить контент
        shell: bash
        run: |
          extra=()
          if [[ "$MODE" == 'publish-prepared' ]]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
            gh run download "$SOURCE_RUN" --pattern 'quantafate-cloud-*' --dir output/restore
            extra+=(--folder output/restore)
          fi
          python cloud_agent.py "$MODE" --target "$TARGET" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantafate-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/cloud-*/
          retention-days: 3
          if-no-files-found: ignore

